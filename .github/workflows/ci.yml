name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Specification & Cross-Language Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Lint RFC proposals
        run: npm run rfc:lint

      - name: Build TypeScript reference implementation
        run: npm run build

      - name: Run TypeScript & Lua emitter test suite
        run: npm test

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python reference test suite
        run: python python/tests/test_converter.py
