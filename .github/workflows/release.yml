name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint RFC specifications
        run: npm run rfc:lint

      - name: Build TypeScript distribution
        run: npm run build

      - name: Package Manifest V3 WebExtension
        run: npm run package:extension

      - name: Run Test Suite (TS, Lua, Userscript, Extension)
        run: npm test

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python tests
        run: python python/tests/test_converter.py

      - name: Build Python distribution
        run: |
          pip install build
          python -m build python/

      - name: Create GitHub Release with Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            dist/ygn-db-helper.zip \
            userscripts/ygn-duelingbook.user.js \
            python/dist/*

      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish to PyPI
        if: env.TWINE_PASSWORD != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload --skip-existing python/dist/*
